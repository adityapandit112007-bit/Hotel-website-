<!DoCTYPE HTML>
<html lang =eng>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width,initial-scale=1.0">
    <title> reservation form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display for luxury headers, Plus Jakarta Sans for UI labels -->
     <link rel="preconnect"
     href="https://fonts.googleapis.com">
     <link rel="preconnect"
     href="https://fonts.googleapis.com/css2?
     family=Playfair+Display:wght@400;500;600;700&family=Plus+jakarta+Sans:wght@300;400;500;600&
     display=swap" rel="stylesheet">
     <!-- Lucide Icons -->
      <script src="https://unpkg.com/lucide@latest"></script>
      <script>
        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        gold:{
                            300:'#F3E5AB',
                            400:'#E2B85C',
                            500:'#C5A059',
                            600:'#B8903B',
                            700:'#8A6A23',
                        },
                        darkPlate:{
                            bg:'#1A1A1E',
                            card:'#222226',
                            input:'#2A2A2E',
                            border:'rgba(197,160,89,0.3)',
                        }
                    },
                    fontFamily:{
                        serif:['"Playfair Dispaly"','serif'],
                        sans:['"Plus jakarta Sans"','sans-serif'],
                    }
                }
            }
        }
      </script>
      <style>
        .navbar{
            background-color: #000000;
            height:60px;
            width:100%;
            display:flex;
            justify-content:space-evenly;
            align-items: center;
            position:fixed;
            top:0;
            left:0;
            z-index:40;
            padding: 0px;
            box-sizing:border-box;
         }
        .navbar a{
         color:gold;
         font-size: 20px;
         }
        .navbar a:hover{
         color: #8613c9;
         text-shadow:
         0 0 10px #8613c9,
         0 0 20px #8613c9,
         0 0 40px #8613c9,
         0 0 60px #8613c9;
         }
        .bn{ 
         height:45px;
         color: gold;
         align-items:center;
         padding-left:15px;
         flex-wrap: wrap;
         border-radius:5px;
         width:60px;
         display: flex;
         }
        img{
         height: 40px;
         width: 100px;
         display:block;
         }
        body{
            background-image:url("{{ url_for('static',filename='night hotel.png')}}");
            background-size: cover;
            background-position: center;
            font-family: 'Plus Jakarta Sans',sans-serif;
            color: #E2E8F0;
            min-height: 100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:flex-start;
            padding:84px 1.5rem 1.5rem;
            margin: 0;
        }
        /* Standalone Gold Border card Plate */
        .reservation-plate{
            background: linear-gradient(180deg,#222226 0%,#1a1a1e 100%);
            border:1px solid rgba(197,160,89,0.35);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7),0 0 20px rgba(197,160,89,0.08);
        }
        /*input focus glowwing outline */
        .input-focus-gold:focus-within{
            border-color:#C5A059
            !important;
            box-shadow: 0 0 10px rgba(197,160,89,0.25);
        }
        /*style html date icon picker */
        input[type="date"]
        ::-webkit-calendar-picker-indicator{
            filter:invert(0.7) sepia(60%) saturate(600%)
            hue-rotate(5deg);
            cursor:pointer;
        }
      </style>
</head>
<body>
    <div class="navbar">
<img src="{{ url_for('static',filename='logo.jpeg')}}" alt="logo">
<div><a href="/home"> Home</a></div>
<div><a href="/events">Events</a> </div>
<div><a href="/dining">Dining</a></div>
<div><a href="/Sovereignty">Sovereignty</a></div>
<div class="bn"><a href="/reservation">Reservation </a></div>
</div>
    <!-- standalone reservation plate container-->
    <div class="w-full max-w-md reservation-plate p-6 sm:p-8 relative">
        <!-- Header-->
     <div class="text-center m,b-7">
        <h1 class="font-serif text-2xl sm:text-3xl font-normal text-gold-500 tracking-wide mb-2">
            Your Reservation
        </h1>
        <p class ="text-xs sm:text-sm font-light text-neutral-400 tracking-wide"> Plan your stay at <span class="text-neutral-200 font-medium">Queens Hotel</span>.
        </p>
     </div>
     <!-- form -->
      <form id="reservationForm" onsubmit="handleFormSubmit(event)"
      class="space-y-4">
      <!--full name-->
      <div class="space-y-1.5">
        <Label for="FullName" class="block text-xs font-medium text-gold-500 tracking-wide"> Full Name </Label>
        <div class="rounded-xl bg-darkPlate-input border border-neutral-700/80 input-focus-gold transition-all duration-200">
        <input 
            type="text"
            id="FullName"
            required
            placeholder="Enter Full Name"
            class="'w-full bg-transparent px-4 py-3 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none rounded-xl"/>
        </div>
    </div>
    <!-- Email Address-->
     <div class="space-y-1.5">
        <label for="email" class="block text-xs font-medium text-gold-500 tracking-wide"> E-mail Address </label>
        <div class="rounded-xl bg-darkPlate-input border border-neutral-700/80 input-focus-gold transition-all duration-200">
            <input type="email" id="email" name="email" required placeholder="Enter email address"t
            class="w-full bg-transparent px-4 py-3 text-neutral-100 placeholder-neutral-500 focus:outline-none rounded-xl"/>
        </div>
     </div>
     <!-- check-in date-->
      <div class="space-y-1.5">
        <label for="checkIn"
        class="block text-xs text-gold-500 tracking-wide"> Check-In Date </label>
        <div class="rounded-xl bg-darkPlate-input border border-neutral-700/80 input-focus-gold transition-all duration-200 flex items-center pr-3">
            <input type="date" id="checkIn" name="checkIn" required class="w-full bg-transparent
             px-4x py-3 text-sm text-neutral-100 focus:outline-none rounded-xl cursor-pointer"/>     
        </div>
      </div>
      <!-- checkout date-->
       <div class="space-y-1.5">
        <label for="checkOut"
        class="block text-xs text-gold-500 tracking-wide"> Check-Out Date</label>
        <div class="rounded-xl bg-darkPlate-input border border-neutral-700/80 input-focus-gold transition-all duration-200 flex items-center pr-3">
            <input type="date" id="checkOut" name="checkOut" required class="w-full bg-transparent
             px-4x py-3 text-sm text-neutral-100 focus:outline-none rounded-xl cursor-pointer"/>
        </div>
       </div>
       <!--Accomodation preference-->
       <div class="space-y-1.5">
        <label for="accomodation"
        Class="block text-xs text-gold-500 tracking-wide"> Accomodation Preference </label>
        <div class="relative rounded-xl bg-darkPlate-input border border-neutral-700/80 input-focus-gold transition-all duration-200">
            <select id="accomodation" name="accomodation" required class="w-full bg-transparent
             px-4x py-3 text-sm text-neutral-100 focus:outline-none rounded-xl appearance-none cursor-pointer pr-10">
            <option value=""
            disabled selected 
            class="bg-darkPlate-card 
            text-neutral-500">
        Choose Accomodation</option>
        <option value="Deluxe"
        class="bg-darkPlate-card text-neutral-200">Deluxe Suite</option>
        <option value="VIP"
        class="bg-darkPlate-card text-neutral-200">VIP Suite</option>
        <option value="Presidential"
        class="bg-darkPlate-card text-neutral-200">Presidential Suite</option>
        <option value="Sovereign"
        class="bg-darkPlate-card text-neutral-200">Sovereign Suite</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-neutral-200">
                <i 
                data -lucide="chevron-down" class="w-4 h-4"></i>
            </div>
        </div>
       </div>
       <!-- Submit Button -->
        <div class="pt-3">
            <button
            type="submit" id="submitBtn" class="w-full bg-gold-500 hover:bg-gold-400 text-neutral-950 font-bold text-xs uppercase tracking-widest py-4
            px-6 rounded-xl sahdow-lg hover:shadow-gold-500/20 active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2">
        <span> REQUEST A RESERVATION</span></button>
        </div>
    </form>
    <!-- Success Modal notification-->
     <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 
     pointer-events-none transition-opacity duration-300">
    <div class="bg-darkPlate-card border border-gold-500/40 rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl transform scale 95 transition-transform
    duration-300" id="modalCard">
     <div class="w-12 h-12 bg-gold-500/20 text-gold-500 rounded-full flex items-center justify-center mx-auto mb-3 border border-gold-500/30">
        <i
        data-lucide="check-circle-2" class="w-7 h-7"></i>
     </div>
     <h3 class="font-semibold text-gold-500 mb-1"> Reservation Request Received</h3>
     <p class="text-xs text-neutral-300 leading-relaxed mb-5" id="modalMessage">
        Thank You. Our reservations team will review your request and get back to you shortly.
     </p>
     <button
     id="dismissBtn" onclick="closeModal()" class="w-full bg-gold-500 hover:bg-gold-400 text-neutral-950 text-xs font-bold py-3 rounded-xl transition-colors">
     DISMISS 
    </button>
</div>
</div>
</div>
<script>
    //initialize Lucide icons
    lucide.createIcons();
    //default date setup
    const checkInInput=document.getElementById('checkIn');
    const checkOutInput=document.getElementById('checkOut');
    const today =new Date().toISOString().split('T')[0];
    checkInInput.min=today;
    checkOutInput.min=today;
    // Handle Form submit
    function handleFormSubmit(event){
        event.preventDefault();
        const dismissBtn=document.getElementById('dismissBtn');
        const submitBtn=document.getElementById('submitBtn');
        const originalText=submitBtn.innerHTML;
        //loading state animation
        submitBtn.disabled=true;
        submitBtn.innerHTML=`<svg class="animate-spin h-4 w-4 text-neutral-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle 
        class ="opacity-25" 
        cx="12" 
        cy="12" 
        r="10"
        stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" 
        fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"> </path>
        </svg> 
        <span> SUBMITTING...</span>
        `;
        setTimeout(()=>{
            submitBtn.disabled=false;
            submitBtn.innerHTML=originalText;
         const name=document.getElementById('FullName').value;
         const email=document.getElementById('email').value;    
         const suite=document.getElementById('accomodation').options[document.getElementById('accomodation').selectedIndex].text;
         document.getElementById('modalMessage').innerHTML=`Thank you, ${name}. 
         Your reservation request for the ${suite} has been received. Our reservations team will review your request and get back to you shortly at ${email}.`;
         //show modal
         const modal=document.getElementById('modal');
         const modalCard=document.getElementById('modalCard');
         modal.classList.remove('opacity-0','pointer-events-none');
         modalCard.classList.remove('scale-95');
         modalCard.classList.add('scale-100');
         dismissBtn.disabled = false;
         //reset form
         document.getElementById('reservationForm').reset();
        },1000);
    }
    function closeModal(){
         const dismissBtn=document.getElementById('dismissBtn');
        const modal=document.getElementById('modal');
        const modalCard=document.getElementById('modalCard');
        modalCard.classList.remove('scale-100');
        modalCard.classList.add('scale-95'); 
        modal.classList.add('opacity-0','pointer-events-none');
        const submitBtn=document.getElementById('submitBtn');
        submitBtn.disabled = false;
    }
</script>
</body>
</html>
